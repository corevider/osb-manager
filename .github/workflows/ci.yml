name: CI

# Builds and tests both apps for every pull request, including pull requests from forks, and for every push to main.
#
#   windows  dotnet build -warnaserror, dotnet test, the page script tests and the token guard tests.
#   macos    the unit tests of OsbManagerCore (OSB_CORE_ONLY=1). The CEF targets and OsbManagerCefTests need the CEF
#            binary distribution and a GUI session, so they run on the operator's Mac (macos/scripts/test.sh).
#
# Why this is safe: it runs on the plain `pull_request` event. For a fork the token is read-only and no secret is
# passed to the job, and these jobs ask for no secret and `contents: read` only, so the PR's code runs with nothing
# worth stealing.
# No job restores an Actions cache: claude-fix.yml builds agent-written code in a run on main's scope, which could write
# cache entries that a later run on main would restore.
# `workflow_dispatch` lets claude-fix.yml start it for PRs it opens with GITHUB_TOKEN, which raises no events.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build
        run: dotnet build OsbManager.slnx -c Release -warnaserror

      - name: Tests
        run: dotnet test OsbManager.slnx -c Release --no-build

      - name: Page script tests
        shell: bash
        run: node --test tests/bridge/*.test.mjs

      - name: Token guard tests
        shell: bash
        run: node --test .github/scripts/*.test.mjs

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core unit tests
        working-directory: macos/OsbManager
        env:
          OSB_CORE_ONLY: "1"
        run: swift test --arch arm64
