name: Release check (Windows)

# Builds, tests and packages the Windows app for a version tag, and keeps the zip only as a workflow artifact.
# It never creates, edits, uploads to or deletes a GitHub release or a tag, and its token can only read.
#
# Why: every release carries update manifests that the maintainer signs on their own computer. Each manifest holds the
# SHA-256 of the exact zip that was signed, and the apps refuse any other zip. A zip built here is never byte-identical
# to the signed one, so uploading it to a release would make every update of that release fail. Releases are made
# by hand, from the signed files, as docs/MAINTAINING.md describes. This workflow only shows that the tagged commit
# builds and passes its tests on a clean runner.
#
# Starts when a maintainer pushes a tag v<major>.<minor>.<patch> (the version must equal <Version> in
# src/OsbManager/OsbManager.csproj), or by hand from the Actions tab for any branch or tag.
#
# Why this is safe: it runs only code that a maintainer tagged or chose, uses no secret, has `contents: read` and
# nothing else, and does not keep the token in the checkout.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check the version
        if: env.REF_TYPE == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' src/OsbManager/OsbManager.csproj | head -n 1)
          [ "v$version" = "$REF_NAME" ] || { echo "Tag $REF_NAME does not match <Version>$version</Version>."; exit 1; }

      - name: Build and test
        run: |
          dotnet build OsbManager.slnx -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test OsbManager.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: ./scripts/package-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/dist"

      - name: Show the checksum
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/dist"
          sha256sum -c OSB-Manager-windows-x64.zip.sha256
          cat OSB-Manager-windows-x64.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OSB-Manager-windows-x64-unsigned-check
          path: |
            ${{ runner.temp }}/dist/OSB-Manager-windows-x64.zip
            ${{ runner.temp }}/dist/OSB-Manager-windows-x64.zip.sha256
          retention-days: 7
          if-no-files-found: error
